{% load static %}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Totes{% endblock %}</title>

		<link
			href="{% static 'css/output.css' %}"
			rel="stylesheet"
			type="text/css"
		/>
	</head>
	<body class="min-h-screen bg-base-200 font-sans text-base-content">
		<div class="flex min-h-screen flex-col md:flex-row">
			<nav
				aria-label="Main"
				class="bg-sidebar text-neutral-content flex flex-col gap-6 p-4 md:w-60 md:shrink-0"
			>
				<a
					href="{% url 'product-list' %}"
					class="flex items-center gap-2.5 px-2 text-lg font-bold tracking-tight text-white"
				>
					<span
						class="bg-primary flex size-8 items-center justify-center rounded-md"
					>
						<svg
							width="18"
							height="18"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M3 7l9-4 9 4-9 4-9-4z" />
							<path d="M3 7v10l9 4 9-4V7" />
							<path d="M12 11v10" />
						</svg>
					</span>
					Totes
				</a>
				{% with current=request.resolver_match.url_name %}
				<ul class="flex flex-row gap-0.5 text-sm md:flex-col">
					<li>
						<a
							href="{% url 'product-list' %}"
							class="hover:bg-sidebar-active flex min-h-11 items-center gap-3 rounded-md px-3 {% if current == 'product-list' %}bg-sidebar-active font-medium text-white{% endif %}"
						>
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z" /><path d="M3 7v10l9 4 9-4V7" /></svg>
							Products
						</a>
					</li>
					<li>
						<a
							href="{% url 'warehouse-list' %}"
							class="hover:bg-sidebar-active flex min-h-11 items-center gap-3 rounded-md px-3 {% if current == 'warehouse-list' %}bg-sidebar-active font-medium text-white{% endif %}"
						>
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12" /><path d="M7 21v-8h10v8" /></svg>
							Warehouses
						</a>
					</li>
					<li>
						<a
							href="{% url 'inventory-list' %}"
							class="hover:bg-sidebar-active flex min-h-11 items-center gap-3 rounded-md px-3 {% if current == 'inventory-list' %}bg-sidebar-active font-medium text-white{% endif %}"
						>
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></svg>
							Inventory
						</a>
					</li>
				</ul>
				{% endwith %}
			</nav>
			<main class="min-w-0 flex-1 p-6 md:px-10 md:py-7">
				{% block content %}{% endblock %}
			</main>
		</div>
	</body>
</html>
